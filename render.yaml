# Render Blueprint — Backend API
# https://render.com/docs/blueprint-spec
#
# Data persistence: free Render disks are ephemeral (SQLite is wiped when the
# service sleeps/redeploys). Set DATABASE_URL in the Render dashboard to a free
# Neon Postgres connection string so SME/lender accounts and transactions survive.

services:
  - type: web
    name: ushirika-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: PSEUDONYMIZATION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://ushirika-sme-portal.vercel.app,https://ushirika-sme-portal-dmmkuliku.vercel.app"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: MODEL_DIR
        value: ./models
      - key: MIN_TRANSACTIONS_FOR_SCORE
        value: "12"
      - key: PYTHON_VERSION
        value: "3.12.8"
